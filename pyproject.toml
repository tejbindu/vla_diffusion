[project]
name = "vla-diffusion-libero"
version = "0.1.0"
description = "Language-conditioned diffusion-policy VLA, trained and evaluated on LIBERO"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "hydra-core>=1.3.4",
    "imageio>=2.37.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "mujoco==3.1.6",
    "numba>=0.60",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "open-clip-torch>=3.3.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "robosuite==1.4.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.68.4",
    "wandb>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_diffusion"]
